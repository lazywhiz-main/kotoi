<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONDO — 体験②「溜まった後」モック v1</title>
<style>
  :root{
    --bg:#f4f2ec;--ink:#26251f;--sub:#6b6960;--hint:#9a978c;--card:#fff;--line:#e7e4da;
    --dig:#534AB7;--dig-bg:#EEEDFE;--con:#0F6E56;--con-bg:#E1F5EE;--ref:#993C1D;--ref-bg:#FAECE7;
    --act:#3B6D11;--act-bg:#EAF3DE;--exp:#0C447C;--exp-bg:#E6F1FB;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;background:#e9e6de;color:var(--ink);
       display:flex;flex-direction:column;align-items:center;padding:26px 16px 60px;-webkit-font-smoothing:antialiased}
  .head{width:100%;max-width:640px;margin-bottom:16px}
  .head h1{font-size:19px;font-weight:600}
  .head p{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.6}
  .phone{width:392px;background:#000;border-radius:44px;padding:11px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
  .scr{background:var(--bg);border-radius:34px;overflow:hidden;height:768px;display:flex;flex-direction:column;position:relative}
  .notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#000;border-radius:0 0 16px 16px;z-index:5}
  .statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13px;font-weight:600;flex:0 0 auto}
  .brand{flex:0 0 auto;padding:2px 20px 12px;display:flex;align-items:baseline;gap:9px;border-bottom:1px solid var(--line)}
  .brand .logo{font-size:20px;font-weight:700;letter-spacing:.14em}
  .brand .sub{font-size:11.5px;color:var(--hint)}
  .body{flex:1;overflow-y:auto;padding:16px 16px 20px}.body::-webkit-scrollbar{width:0}
  .h2{font-size:15px;font-weight:600;margin-bottom:3px}
  .lead{font-size:12px;color:var(--sub);margin-bottom:14px;line-height:1.6}

  .filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
  .filters button{font:inherit;font-size:12px;white-space:nowrap;border:1px solid var(--line);background:#fff;color:#54524a;padding:5px 11px;border-radius:20px;cursor:pointer}
  .filters button.on{background:#3a3630;color:#f7f5ef;border-color:#3a3630}
  .qrow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px;cursor:pointer}
  .qrow .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
  .qtag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:12px}
  .t-dig{color:var(--dig);background:var(--dig-bg)}.t-con{color:var(--con);background:var(--con-bg)}
  .t-ref{color:var(--ref);background:var(--ref-bg)}.t-act{color:var(--act);background:var(--act-bg)}.t-exp{color:var(--exp);background:var(--exp-bg)}
  .qrow .q{font-size:13.5px;line-height:1.65;font-weight:500}
  .qrow .src{font-size:11px;color:var(--hint);margin-top:7px;display:flex;align-items:center;gap:5px}
  .qrow .go{font-size:16px;color:#c3bfb4}

  .theme{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:12px}
  .theme .tt{font-size:15px;font-weight:600;margin-bottom:8px}
  .theme .stat{font-size:11.5px;color:var(--sub);display:flex;gap:12px;margin-bottom:11px}
  .theme .stat b{color:var(--ink);font-weight:600}
  .theme .synth{background:#f6f4ee;border-left:3px solid #b9b4a6;border-radius:0 8px 8px 0;padding:10px 12px;font-size:13px;line-height:1.65}
  .theme .synth .l{font-size:10.5px;color:var(--hint);font-weight:700;display:block;margin-bottom:4px}
  .prog{height:6px;background:#eae7dd;border-radius:6px;margin:12px 0 6px;overflow:hidden}
  .prog i{display:block;height:100%;background:#8a8577}
  .theme .pl{font-size:11px;color:var(--hint)}
  .theme .open{margin-top:12px;width:100%;font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:#faf9f5;color:#3d3b34;padding:9px;border-radius:10px;cursor:pointer}

  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:16px}
  .stat-c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  .stat-c .n{font-size:22px;font-weight:600}.stat-c .l{font-size:11.5px;color:var(--sub);margin-top:2px}
  .block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:11px}
  .block .bl{font-size:11px;font-weight:700;color:var(--hint);letter-spacing:.03em;margin-bottom:7px}
  .block .bt{font-size:13.5px;line-height:1.65}
  .recall{background:#fbf6ea;border:1px dashed #d8c48f;border-radius:14px;padding:13px 14px;margin-bottom:11px}
  .recall .bl{color:#8a5a00}
  .maplink{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer}
  .maplink .mt{font-size:13.5px;font-weight:500}.maplink .ms{font-size:11.5px;color:var(--hint);margin-top:2px}

  .tabbar{flex:0 0 auto;border-top:1px solid var(--line);background:#efece4;display:flex;padding:8px 8px 12px}
  .tabbar button{flex:1;border:0;background:transparent;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:#9a978c;font-size:11px}
  .tabbar button i{font-size:20px;font-style:normal}
  .tabbar button.on{color:#26251f;font-weight:600}
  .foot{width:100%;max-width:640px;margin-top:20px;font-size:12px;color:var(--sub);line-height:1.7}
</style>
</head>
<body>
  <div class="head">
    <h1>MONDO — 体験②「溜まった後」モック v1</h1>
    <p>スレッドが何本も溜まった後の横断ビュー。下のタブで「問いの棚 / 探究 / ふりかえり」を切り替え。問いの棚は類型フィルタも動きます。</p>
  </div>

  <div class="phone"><div class="scr">
    <div class="notch"></div>
    <div class="statusbar"><span>9:41</span><span>&#9679;&#9679;&#9679; &#128246; &#128267;</span></div>
    <div class="brand"><span class="logo">MONDO</span><span class="sub">問いが増える</span></div>
    <div class="body" id="body"></div>
    <div class="tabbar" id="tabbar">
      <button data-t="shelf" class="on"><i>&#9776;</i>問いの棚</button>
      <button data-t="quest"><i>&#10022;</i>探究</button>
      <button data-t="review"><i>&#8635;</i>ふりかえり</button>
    </div>
  </div></div>

  <div class="foot">
    <p>体験①のスレッドがここへ素材を供給します。問いの棚＝未回答の問いが並ぶ場所、探究＝似たメモ・問いが束になって立ち上がるテーマ、ふりかえり＝今週の横断まとめ＋呼び戻し。問いの地図は探究の中の副次ビューとして置いています。</p>
  </div>

<script>
const QUESTIONS=[
  {t:['t-dig','深掘り'],q:'あなたのチームの"詰まり"は、情報の非対称のどこで起きてる？',src:'少人数＝速い（記事）'},
  {t:['t-act','行動'],q:'②情報共有と③権限委譲、今週動かせるのはどっち？',src:'少人数＝速い（記事）'},
  {t:['t-dig','深掘り'],q:'自社の価格は"コスト基準"と"価値基準"のどっち寄り？',src:'SaaSの値付け3パターン（動画）'},
  {t:['t-ref','反証'],q:'"値上げが怖い"は、データ？　それとも感覚？',src:'SaaSの値付け3パターン（動画）'},
  {t:['t-con','接続'],q:'松竹梅の"松"は、どの値付けパターンに当たる？',src:'松が売れない'},
  {t:['t-act','行動'],q:'委譲できる意思決定の"最小単位"は何？',src:'権限が自分に集中'},
  {t:['t-exp','拡張'],q:'価格を"成果単位"にしたら、詰まりはどこへ移る？',src:'競合Xが成果課金'}
];
const COL={'t-dig':['#534AB7','#EEEDFE'],'t-con':['#0F6E56','#E1F5EE'],'t-ref':['#993C1D','#FAECE7'],'t-act':['#3B6D11','#EAF3DE'],'t-exp':['#0C447C','#E6F1FB']};
const THEMES=[
  {tt:'意思決定の"詰まり"の正体',short:['詰まりの','正体'],memos:3,qs:7,ans:2,synth:'「人数の少なさ」だと思っていた詰まりは、〈情報の非対称〉と〈権限の集中〉という同じ根の別の顔かもしれない。',pct:29,
   map:[
     {label:'少人数=速い',qs:[['t-dig','情報の非対称のどこ？','あなたのチームの"詰まり"は、情報の非対称のどこで起きてる？'],['t-act','今週動かすのは？','②情報共有と③権限委譲、今週動かせるのはどっち？']]},
     {label:'権限集中',qs:[['t-act','委譲の最小単位？','委譲できる意思決定の"最小単位"は何？']]},
     {label:'情報の偏り',qs:[['t-con','同じ根では？','情報が特定の人に偏る問題と、意思決定の詰まりは同じ根では？']]}
   ]},
  {tt:'価値ベースの値付けへ',short:['価値ベース','値付け'],memos:4,qs:9,ans:3,synth:'コスト基準・競合横並びから抜けられていないのが共通項。成果に価格を連動させる筋を、一度きちんと検討する価値がある。',pct:33,
   map:[
     {label:'SaaS値付',qs:[['t-dig','コスト/価値？','自社の価格は"コスト基準"と"価値基準"のどっち寄り？'],['t-ref','怖いは感覚？','"値上げが怖い"は、データ？それとも感覚？']]},
     {label:'松が売れ',qs:[['t-con','どのパターン？','松竹梅の"松"は、どの値付けパターンに当たる？']]},
     {label:'導入負荷',qs:[['t-exp','値段より負荷？','顧客は値段より導入負荷を気にしている。価格の議論はずれてない？']]},
     {label:'成果課金',qs:[['t-exp','詰まりはどこへ？','価格を"成果単位"にしたら、詰まりはどこへ移る？']]}
   ]}
];

const body=document.getElementById('body');
let filter='all';

function shelf(){
  const cats=[['all','すべて'],['t-dig','深掘り'],['t-con','接続'],['t-ref','反証'],['t-act','行動'],['t-exp','拡張']];
  const list=QUESTIONS.filter(x=>filter==='all'||x.t[0]===filter);
  body.innerHTML=`<div class="h2">問いの棚</div><div class="lead">まだ答えていない問い ${QUESTIONS.length}件。押すと元のスレッドへ。</div>
    <div class="filters">${cats.map(c=>`<button data-f="${c[0]}" class="${filter===c[0]?'on':''}">${c[1]}</button>`).join('')}</div>
    ${list.map(x=>`<div class="qrow"><div class="top"><span class="qtag ${x.t[0]}">${x.t[1]}</span><span class="go">&#8250;</span></div><div class="q">${x.q}</div><div class="src">&#128196; ${x.src}</div></div>`).join('')}`;
  body.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;shelf();});
}
function quest(){
  body.innerHTML=`<div class="h2">探究</div><div class="lead">似たメモと問いが束になって立ち上がったテーマ。${THEMES.length}件が育っています。</div>
    ${THEMES.map((t,i)=>`<div class="theme"><div class="tt">${t.tt}</div>
      <div class="stat"><span><b>${t.memos}</b> メモ</span><span><b>${t.qs}</b> 問い</span><span>回答 <b>${t.ans}</b>/${t.qs}</span></div>
      <div class="synth"><span class="l">この束が示唆すること</span>${t.synth}</div>
      <div class="prog"><i style="width:${t.pct}%"></i></div><div class="pl">探究が ${t.pct}% 進行</div>
      <button class="open" onclick="openTheme(${i})">この探究を開く（問いの地図で見る）</button></div>`).join('')}`;
}
function openTheme(i){
  const th=THEMES[i], cx=168, cy=176, R1=88, R2=138, H=356;
  let lines='',memoNodes='',qdots='',qlist='',qn=0,n=th.map.length;
  th.map.forEach((m,mi)=>{
    const baseDeg=-90+mi*(360/n), a=baseDeg*Math.PI/180;
    const mx=cx+R1*Math.cos(a), my=cy+R1*Math.sin(a);
    lines+=`<line x1="${cx}" y1="${cy}" x2="${mx}" y2="${my}" stroke="#cfcbc0" stroke-width="1.4"/>`;
    memoNodes+=`<circle cx="${mx}" cy="${my}" r="30" fill="#fff" stroke="#d9d5c9" stroke-width="1.4"/><text x="${mx}" y="${my+3}" text-anchor="middle" font-size="9.5" fill="#4a4842">${m.label}</text>`;
    const spread=(m.qs.length-1)*17;
    m.qs.forEach((q,qi)=>{
      qn++;
      const qa=(baseDeg+(qi*17-spread/2))*Math.PI/180;
      const qx=cx+R2*Math.cos(qa), qy=cy+R2*Math.sin(qa), col=COL[q[0]];
      lines+=`<line x1="${mx}" y1="${my}" x2="${qx}" y2="${qy}" stroke="${col[0]}" stroke-width="1.2" opacity="0.5"/>`;
      qdots+=`<circle cx="${qx}" cy="${qy}" r="12" fill="${col[1]}" stroke="${col[0]}" stroke-width="1.3"/><text x="${qx}" y="${qy+3.5}" text-anchor="middle" font-size="10" font-weight="700" fill="${col[0]}">${qn}</text>`;
      qlist+=`<div class="qrow"><div class="top"><span class="qtag ${q[0]}">${qn}. ${q[1]}</span></div><div class="q">${q[2]}</div></div>`;
    });
  });
  body.innerHTML=`<button class="open" style="width:auto;padding:6px 13px;margin-bottom:11px" onclick="quest()">&#8249; 探究にもどる</button>
    <div class="h2">${th.tt}</div>
    <div class="theme" style="margin-bottom:12px"><div class="synth"><span class="l">この束が示唆すること</span>${th.synth}</div></div>
    <div class="lead" style="text-align:center;margin-bottom:4px">問いの地図 — 中心が探究、まわりがメモ、外側が問い</div>
    <svg viewBox="0 0 336 ${H}" style="width:100%;height:auto">${lines}
      <circle cx="${cx}" cy="${cy}" r="42" fill="#3a3630"/>
      <text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="10.5" fill="#f4f2ec">${th.short[0]}</text>
      <text x="${cx}" y="${cy+11}" text-anchor="middle" font-size="10.5" fill="#f4f2ec">${th.short[1]}</text>
      ${memoNodes}${qdots}</svg>
    <div class="h2" style="font-size:14px;margin-top:8px">この探究の問い ${qn}</div>
    <div class="lead">番号は地図の問いと対応。押すと元スレッドへ。</div>
    ${qlist}`;
  body.scrollTop=0;
}
function review(){
  body.innerHTML=`<div class="h2">今週のふりかえり</div><div class="lead">7月2日〜7月8日</div>
    <div class="stats">
      <div class="stat-c"><div class="n">7</div><div class="l">新しいメモ</div></div>
      <div class="stat-c"><div class="n">23</div><div class="l">生まれた問い</div></div>
      <div class="stat-c"><div class="n">5</div><div class="l">答えた問い</div></div>
      <div class="stat-c"><div class="n">2</div><div class="l">立ち上がった探究</div></div>
    </div>
    <div class="block"><div class="bl">今週くり返し出たテーマ</div><div class="bt">「価値ベースの値付け」。3つの別々のメモから、同じ方向の問いが出ています。</div></div>
    <div class="block"><div class="bl">未回答で、いちばん熱い問い</div><div class="bt">自社は結局、誰の何を"速く"しているのか？</div></div>
    <div class="recall"><div class="bl">&#8635; 呼び戻し</div><div class="bt">3週間前の問い「"速い"の中身は？　決定の速さと質を分けてる？」——まだ生きてる？</div></div>
    <div class="maplink"><div><div class="mt">問いの地図</div><div class="ms">今週の問いのつながりを俯瞰する（副次）</div></div><span class="go" style="font-size:18px;color:#c3bfb4">&#8250;</span></div>`;
}
const VIEWS={shelf,quest,review};
document.querySelectorAll('#tabbar button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tabbar button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  body.scrollTop=0;VIEWS[b.dataset.t]();
});
shelf();
</script>
</body>
</html>
