<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画像AI フィージビリティ</title>
  <link rel="stylesheet" href="/shared.css">
  <style>
    .steps { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .steps span {
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 20px;
      border: 1px solid var(--line2);
      color: var(--hint);
    }
    .steps span.done { border-color: var(--ok); color: var(--ok); }
    .steps span.active { border-color: var(--accent); color: var(--accent); }

    .variant-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .variant-card {
      background: var(--card2);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }
    .variant-card.recommended {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .variant-card .vh {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .variant-card .vh h3 { font-size: 13px; }
    .variant-card .vh .id { font-size: 10px; color: var(--hint); }
    .rec-badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 10px;
      background: color-mix(in srgb, var(--accent) 20%, transparent);
      color: var(--accent);
      white-space: nowrap;
    }
    .variant-card .intent {
      padding: 8px 12px;
      font-size: 11px;
      color: var(--sub);
      line-height: 1.55;
      border-bottom: 1px solid var(--line);
    }
    .variant-card .img-wrap {
      aspect-ratio: var(--aspect-w, 1) / var(--aspect-h, 1);
      background: #181410;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .variant-card .img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .variant-card .img-wrap .ph {
      padding: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--hint);
      line-height: 1.6;
    }
    .variant-card .prompt {
      padding: 10px 12px;
      font-size: 10px;
      font-family: ui-monospace, monospace;
      color: var(--hint);
      line-height: 1.45;
      max-height: 120px;
      overflow: auto;
    }
    .variant-card .actions {
      padding: 8px 12px;
      border-top: 1px solid var(--line);
    }
    .variant-card .actions button {
      font-size: 11px;
      padding: 6px 10px;
    }

    .selection-box {
      margin: 12px 0;
      padding: 12px;
      background: var(--card2);
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 12px;
      line-height: 1.6;
      color: var(--sub);
      display: none;
    }
    .selection-box strong { color: var(--text); }

    .overlay-preview {
      margin-top: 14px;
      padding: 12px;
      background: var(--card2);
      border-radius: 12px;
      border: 1px solid var(--line);
    }
    .overlay-preview h4 { font-size: 12px; margin-bottom: 8px; color: var(--sub); }
    .overlay-preview .cap {
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 6px;
      padding-left: 10px;
      border-left: 2px solid var(--line2);
    }

    .checklist { margin-top: 14px; }
    .checklist label {
      display: flex;
      gap: 8px;
      font-size: 12px;
      color: var(--sub);
      line-height: 1.55;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .size-badge {
      font-size: 11px;
      color: var(--hint);
      margin-bottom: 10px;
    }
    .controls { flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <nav class="nav" style="margin-bottom:10px">
          <a href="/">← 一覧</a>
          <span class="on">画像AI実験</span>
        </nav>
        <h1>画像生成 AI フィージビリティ</h1>
        <p>Claude が4パターンのプロンプトを作り、<strong>おすすめ1つ</strong>を選ぶ。画像は OpenAI（既定 <code>gpt-image-2</code>）。</p>
        <p class="size-badge" id="size-badge">画像サイズ: 1024×1024（1:1 正方形）</p>
      </div>
      <div id="health" class="status">…</div>
    </div>

    <div class="steps" id="steps">
      <span id="step1">① プロンプト生成</span>
      <span id="step2">② 画像生成（任意）</span>
      <span id="step3">③ 品質チェック</span>
    </div>

    <div class="controls" style="margin-bottom:14px">
      <select id="sample">
        <option value="work_body">働き方と身体の境界</option>
        <option value="child_learning">子どもの学びと自分の焦り</option>
      </select>
      <select id="image-size">
        <option value="1024x1024" selected>1:1 正方形（1024²）</option>
        <option value="1024x1792">9:16 縦（1024×1792）</option>
      </select>
      <button id="btn-prompts">① プロンプトだけ</button>
      <button id="btn-recommended">② おすすめ1枚だけ生成</button>
      <button id="btn-all">② 全4枚生成（コスト大）</button>
    </div>

    <div id="status" class="status"></div>
    <div class="selection-box" id="selection-box"></div>

    <div class="overlay-preview" id="text-in-image" style="display:none">
      <h4>画像に入れる想定テキスト（プロンプト内で指定）</h4>
      <div id="text-in-image-list"></div>
    </div>

    <div class="variant-grid" id="grid"></div>

    <div class="panel checklist" style="margin-top:18px">
      <div class="panel-h">評価チェック</div>
      <div class="panel-b">
        <label><input type="checkbox"> 子供のクレヨン手書きのトーン（線・色・字）になっている</label>
        <label><input type="checkbox"> 手書きの日本語ラベル・矢印など文字が自然にある</label>
        <label><input type="checkbox"> 探究の内容が十分伝わる（単純化しすぎていない）</label>
        <label><input type="checkbox"> プロのグラレコ・ビジネスイラストっぽくない</label>
        <label><input type="checkbox"> 構図バランスがよい</label>
        <label><input type="checkbox"> synthesis（束の示唆）が視覚的に伝わる</label>
        <label><input type="checkbox"> MONDO の探究として載せたいと思える</label>
      </div>
    </div>
  </div>

  <script type="module">
    import { checkHealth, getExploration, generateImageBatch, generateSingleImage, GRAPHIC_REC_SIZES } from '/shared.js';

    const health = document.getElementById('health');
    const status = document.getElementById('status');
    const grid = document.getElementById('grid');
    const selectionBox = document.getElementById('selection-box');
    const textInImage = document.getElementById('text-in-image');
    const textInImageList = document.getElementById('text-in-image-list');
    const sample = document.getElementById('sample');
    const imageSizeSelect = document.getElementById('image-size');
    const sizeBadge = document.getElementById('size-badge');

    let lastBatch = null;

    function selectedImageSize() {
      return imageSizeSelect.value;
    }

    function applyAspectRatio(sizeKey) {
      const preset = GRAPHIC_REC_SIZES[sizeKey] ?? GRAPHIC_REC_SIZES['1024x1024'];
      document.documentElement.style.setProperty('--aspect-w', String(preset.aspectW));
      document.documentElement.style.setProperty('--aspect-h', String(preset.aspectH));
      sizeBadge.textContent = `画像サイズ: ${preset.label}`;
    }

    imageSizeSelect.onchange = () => applyAspectRatio(selectedImageSize());
    applyAspectRatio(selectedImageSize());

    try {
      const h = await checkHealth();
      health.className = 'status ' + (h.anthropic ? 'ok' : 'err');
      const modelHint = h.openAiImageModel ? ` · ${h.openAiImageModel}` : '';
      const qualityHint = h.openAiImageQuality ? `/${h.openAiImageQuality}` : '';
      health.textContent = h.anthropic
        ? `Claude ✓${h.openai ? ` · OpenAI ✓${modelHint}${qualityHint}` : ' · OpenAI ✗（プロンプトのみ）'}`
        : 'ANTHROPIC_API_KEY 未設定';
      if (h.imageSize && GRAPHIC_REC_SIZES[h.imageSize]) {
        imageSizeSelect.value = h.imageSize;
        applyAspectRatio(h.imageSize);
      }
    } catch {
      health.className = 'status err';
      health.textContent = 'サーバー未起動';
    }

    function setStep(n) {
      ['step1','step2','step3'].forEach((id, i) => {
        const el = document.getElementById(id);
        el.classList.remove('done', 'active');
        if (i + 1 < n) el.classList.add('done');
        if (i + 1 === n) el.classList.add('active');
      });
    }

    function renderVariantCard(v) {
      const card = document.createElement('div');
      card.className = 'variant-card' + (v.recommended ? ' recommended' : '');
      card.dataset.id = v.id;
      const imgHtml = v.imageDataUrl
        ? `<img src="${v.imageDataUrl}" alt="${v.label}">`
        : `<div class="ph">${v.imageError ? `⚠ ${v.imageError}` : 'プロンプトのみ<br>「この1枚を生成」で試せます'}</div>`;
      const recBadge = v.recommended ? '<span class="rec-badge">AIおすすめ</span>' : '';
      card.innerHTML = `
        <div class="vh"><h3>${v.label}</h3>${recBadge}<span class="id">${v.id}</span></div>
        <div class="intent">${v.intent ?? ''}</div>
        <div class="img-wrap">${imgHtml}</div>
        <div class="prompt">${(v.image_prompt ?? '').replace(/</g,'&lt;')}</div>
        <div class="actions">
          <button type="button" class="ghost gen-one">この1枚を生成</button>
        </div>`;
      card.querySelector('.gen-one').onclick = async (e) => {
        const btn = e.target;
        btn.disabled = true;
        btn.textContent = '生成中…';
        try {
          const { imageDataUrl } = await generateSingleImage(v.image_prompt, selectedImageSize());
          card.querySelector('.img-wrap').innerHTML = `<img src="${imageDataUrl}" alt="">`;
          setStep(3);
        } catch (err) {
          alert(err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = 'この1枚を生成';
        }
      };
      return card;
    }

    function renderBatch(data) {
      lastBatch = data;
      grid.innerHTML = '';

      if (data.recommended_variant) {
        selectionBox.style.display = 'block';
        selectionBox.innerHTML =
          `<strong>AIおすすめ: ${data.recommended_variant}</strong> — ${data.selection_reason ?? ''}`;
      } else {
        selectionBox.style.display = 'none';
      }

      for (const v of data.variants ?? []) {
        grid.appendChild(renderVariantCard(v));
      }

      if (data.variants?.some((v) => v.text_in_image?.length)) {
        textInImage.style.display = 'block';
        textInImageList.innerHTML = (data.variants ?? [])
          .filter((v) => v.text_in_image?.length)
          .map(
            (v) =>
              `<div class="cap"><strong>${v.label}</strong> ${(v.text_in_image ?? []).map((t) => `「${t}」`).join(' ')}</div>`,
          )
          .join('');
      } else {
        textInImage.style.display = 'none';
      }
    }

    async function run({ generateImages, recommendedOnly }) {
      const btnP = document.getElementById('btn-prompts');
      const btnR = document.getElementById('btn-recommended');
      const btnA = document.getElementById('btn-all');
      btnP.disabled = btnR.disabled = btnA.disabled = true;
      setStep(1);
      status.className = 'status';
      status.textContent = generateImages
        ? recommendedOnly
          ? 'プロンプト生成 → おすすめ1枚を生成中…'
          : 'プロンプト生成 → 4枚の画像生成中（2〜3分）…'
        : 'Claude が4種類のプロンプト＋おすすめ選択中…';
      const t0 = performance.now();
      try {
        const exploration = getExploration(sample.value);
        const data = await generateImageBatch(exploration, {
          generateImages,
          recommendedOnly,
          imageSize: selectedImageSize(),
        });
        renderBatch(data);
        const sec = ((performance.now() - t0) / 1000).toFixed(0);
        setStep(generateImages ? 3 : 2);
        status.className = 'status ok';
        const imgCount = (data.variants ?? []).filter((v) => v.imageDataUrl).length;
        const rec = data.recommended_variant ? ` · おすすめ ${data.recommended_variant}` : '';
        status.textContent = `完了 ${sec}s — variants ${data.variants?.length ?? 0}${generateImages ? ` · 画像 ${imgCount}` : ''}${rec}`;
      } catch (err) {
        status.className = 'status err';
        status.textContent = err.message ?? String(err);
      } finally {
        btnP.disabled = btnR.disabled = btnA.disabled = false;
      }
    }

    document.getElementById('btn-prompts').onclick = () => run({ generateImages: false });
    document.getElementById('btn-recommended').onclick = () => run({ generateImages: true, recommendedOnly: true });
    document.getElementById('btn-all').onclick = () => {
      if (!confirm('OpenAI で最大4枚生成します（有料API）。続けますか？')) return;
      run({ generateImages: true, recommendedOnly: false });
    };
  </script>
</body>
</html>
